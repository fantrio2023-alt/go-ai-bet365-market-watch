name: Bet365 Market Watch (source validation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bet365-market-watch.yml'

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate source only (runtime uses main repository secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile go_ai_football_market_watch.py
      - name: Explain canonical runtime
        run: |
          echo "Source validation passed."
          echo "Live scheduled monitor: fantrio2023-alt/go-ai-monitor"
          echo "Provider key used by the live monitor: ODDS_API_IO_KEY"
          echo "This source-only workflow makes no provider request and consumes no API quota."
